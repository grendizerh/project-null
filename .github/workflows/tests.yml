name: Project NULL checks

on:
  push:
  pull_request:

jobs:
  offline-tests:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build backend
        run: python -m pip install setuptools
      - name: Install hash-pinned dependencies
        run: python -m pip install --require-hashes --no-deps --no-build-isolation -r requirements.txt
      - name: Compile Python source
        run: python -m py_compile project_null.py
      - name: Check shell scripts
        run: |
          bash -n setup_macos.sh
          bash -n start.command
      - name: Run offline self-tests
        run: python project_null.py --self-test
