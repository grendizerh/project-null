name: Project NULL checks

on:
  push:
  pull_request:

jobs:
  offline-tests:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build backend
        run: python -m pip install setuptools
      - name: Install hash-pinned dependencies
        run: python -m pip install --require-hashes --no-deps --no-build-isolation -r requirements.txt
      - name: Compile Python source
        run: python -m py_compile project_null.py
      - name: Check shell scripts
        run: |
          bash -n setup_macos.sh
          bash -n start.command
      - name: Run offline self-tests
        run: python project_null.py --self-test
